<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - ELORA</title>
    <link rel="stylesheet" href="style.css">
    <style>
main{max-width:520px; margin:30px auto; background:#fff; padding:35px 25px; border-radius:15px; border:1px solid #e5dccf}
h2{font-size:32px; text-align:center}
label{font-size:20px; font-weight:bold}
input{width:100%; padding:16px; font-size:18px; margin:10px 0 20px; border-radius:10px; box-sizing:border-box; background:#fef9ef;}
button{width:100%; padding:16px; font-size:20px; border-radius:10px}
</style>
</head>
    <footer>
<p>© 2026 ELORA</p>
</footer>
<body>
    <header>
        <h1>ELORA</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="login.html">تسجيل الدخول</a>
            <a href="signup.html">إنشاء حساب</a>
        </nav>
    </header>
    <main>
        <h2>إنشاء حساب جديد</h2>
        <form>
            <label>الأسم</label><br>
            <input type="text" placeholder="ادخلي اسمك "><br><br>
            <label>البريد الإلكتروني</label><br>
            <input type="email" placeholder="البريد"><br><br>
            <label>كلمة المرور</label><br>
            <input type="password" placeholder="كلمة المرور"><br><br>
            <button type="submit">إنشاء الحساب</button>
        </form>
    </main>
